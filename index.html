    }

  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px;
    background: var(--bg); color: var(--text);
    font: 15px/1.55 var(--font-sans);
    -webkit-font-smoothing: antialiased;
  }
  .gate { width: 100%; max-width: 380px; }
  .mark {
    display: inline-flex; align-items: center; gap: 9px;
    font-weight: 620; letter-spacing: -0.01em;
  }
  .mark .glyph { width: 30px; height: 30px; flex: none; }
  h1 {
    font-size: 25px; line-height: 1.15; letter-spacing: -0.02em;
    margin: 20px 0 8px;
  }
  .lede { color: var(--text-dim); margin: 0 0 20px; }
  form { display: flex; flex-wrap: wrap; gap: 10px; }
  input[type="password"] {
    flex: 1 1 190px; min-width: 0;
    padding: 12px 14px;
    font: inherit; color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: calc(var(--radius) - 2px);
    box-shadow: var(--shadow);
  }
  input[type="password"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .btn {
    display: inline-flex; align-items: center; gap: 9px;
    background: var(--accent); color: var(--accent-text);
    border: 1px solid transparent; border-radius: calc(var(--radius) - 2px);
    padding: 12px 18px; font: inherit; font-weight: 620; cursor: pointer;
  }
  .btn:hover { filter: brightness(1.06); }
  .btn[disabled] { opacity: 0.6; cursor: default; filter: none; }
  .msg { min-height: 1.5em; margin: 14px 0 0; font-size: 14px; color: var(--text-dim); }
  .msg.bad { color: var(--danger); }
  .spinner {
    display: inline-block; vertical-align: -2px; margin-right: 7px;
    width: 13px; height: 13px; border-radius: 50%;
    border: 2px solid var(--border-strong); border-top-color: var(--accent);
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }
  .foot { margin: 22px 0 0; font-size: 13px; color: var(--text-dim); }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

<script>
(function () {
  "use strict";

  var payload = JSON.parse(document.getElementById("payload").textContent);
  var form = document.getElementById("unlock");
  var input = document.getElementById("pw");
  var button = document.getElementById("go");
  var msg = document.getElementById("msg");
  var KEY = "kolga.site.password";

  function say(text, bad) {
    msg.innerHTML = "";
    msg.className = "msg" + (bad ? " bad" : "");
    if (!text) return;
    if (!bad) msg.appendChild(Object.assign(document.createElement("span"), { className: "spinner" }));
    msg.appendChild(document.createTextNode(text));
  }

  function bytes(b64) {
    var bin = atob(b64);
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  // WebCrypto needs a secure context: https, or localhost while developing.
  var subtle = window.crypto && window.crypto.subtle;
  if (!subtle) {
    say(window.isSecureContext === false
      ? "This page has to be served over https to decrypt."
      : "This browser cannot decrypt the page.", true);
    button.disabled = true;
    input.disabled = true;
    return;
  }

  function unlock(password, quiet) {
    button.disabled = true;
    say("Decrypting…", false);

    return subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"])
      .then(function (base) {
        return subtle.deriveKey(
          { name: "PBKDF2", salt: bytes(payload.salt), iterations: payload.iterations, hash: "SHA-256" },
          base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      })
      .then(function (key) {
        // AES-GCM authenticates as it decrypts, so a wrong password throws here
        // and there is no separate hash of the password to attack.
        return subtle.decrypt({ name: "AES-GCM", iv: bytes(payload.iv) }, key, bytes(payload.ciphertext));
      })
      .then(function (plaintext) {
        try { sessionStorage.setItem(KEY, password); } catch (e) {}
        var html = new TextDecoder().decode(plaintext);
        // Replacing the document in place keeps the origin and the URL, which the
        // page needs: it fetches the release feeds from this very directory.
        document.open();
        document.write(html);
        document.close();
      })
      .catch(function () {
        try { sessionStorage.removeItem(KEY); } catch (e) {}
        button.disabled = false;
        say(quiet ? "" : "That password did not work.", !quiet);
        input.select();
      });
  }

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    if (input.value) unlock(input.value, false);
  });

  // A reload inside the same tab should not ask again.
  var remembered = null;
  try { remembered = sessionStorage.getItem(KEY); } catch (e) {}
  if (remembered) unlock(remembered, true);
  else say("");
})();
</script>
</body>
</html>
